name: Nightly snapshot
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      git_top:
        description: Fetch sources of the N best-scored mods/games
        default: "300"

permissions:
  contents: write

concurrency:
  group: nightly-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LDG_HOME: ${{ github.workspace }}/.ldg
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      # Package details are cached by release id and the corpus by release marker, so a
      # night with few new releases costs ContentDB ~15 requests plus the changed packages.
      - uses: actions/cache@v6
        with:
          path: |
            .ldg/cache
            .ldg/corpus
          key: ldg-${{ github.run_id }}
          restore-keys: ldg-
      - name: Build
        run: uv run ldg build --details --git-top "${{ inputs.git_top || '300' }}" --json > stats.json
      - name: Pack
        run: |
          uv run ldg snapshot-pack --output luanti-deps.sqlite.zst
          uv run ldg info --json > info.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view snapshot >/dev/null 2>&1 || \
            gh release create snapshot --title "Nightly snapshot" --notes "Rolling database snapshot." --latest=false
          gh release upload snapshot luanti-deps.sqlite.zst info.json --clobber
          {
            echo "Rolling nightly database snapshot. Download with \`ldg update\`."
            echo
            echo '```json'
            cat info.json
            echo '```'
          } > notes.md
          gh release edit snapshot --notes-file notes.md
