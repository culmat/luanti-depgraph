name: Nightly snapshot
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      git_top:
        description: Fetch sources of the N best-scored mods/games
        default: "300"
      details:
        description: Fetch per-package details (license, engine range, game support)
        type: boolean
        default: true
      publish:
        description: Publish the snapshot release (off for a dry run)
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LDG_HOME: ${{ github.workspace }}/.ldg
      HF_HOME: ${{ github.workspace }}/.ldg/hf
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --all-extras
      # Package details are cached by release id and the corpus by release marker, so a
      # night with few new releases costs ContentDB ~15 requests plus the changed packages.
      # Don't change `path`: entries only restore for the same path list, and a miss means a
      # cold build of ~7000 ContentDB requests. Cache anything new in a separate step.
      - uses: actions/cache@v6
        with:
          path: |
            .ldg/cache
            .ldg/corpus
          key: ldg-${{ github.run_id }}
          restore-keys: ldg-
      # The code-search embedding model (codesearch.MODEL), so Hugging Face is only asked once.
      - uses: actions/cache@v6
        with:
          path: .ldg/hf
          key: hf-potion-code-16M
      - name: Previous snapshot (to carry dependency history forward)
        run: uv run ldg update || echo "no previous snapshot"
      - name: Build
        # Scheduled runs have no inputs: details and publishing default to on.
        run: |
          flags=(--git-top "${{ inputs.git_top || '300' }}")
          [[ "${{ inputs.details }}" == "false" ]] || flags+=(--details)
          uv run ldg build "${flags[@]}" --json > stats.json
      - name: Code search index
        # -15 is ~4x faster than -19 for a 5% larger file.
        run: |
          [[ -d "$HF_HOME/hub" ]] && export HF_HUB_OFFLINE=1
          uv run ldg code index --json > code-stats.json
          zstd -q -15 -T0 -f "$LDG_HOME/luanti-code.sqlite" -o luanti-code.sqlite.zst
      - name: Explorer site
        run: uv run ldg site --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Pack
        run: |
          uv run ldg snapshot-pack --output luanti-deps.sqlite.zst
          uv run ldg info --json > info.json
      - name: Publish
        # Scheduled runs have no inputs, and `null != false` is false in expressions
        # (both coerce to 0), so test the event instead of comparing with false.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view snapshot >/dev/null 2>&1 || \
            gh release create snapshot --title "Nightly snapshot" --notes "Rolling database snapshot." --latest=false
          gh release upload snapshot luanti-deps.sqlite.zst luanti-code.sqlite.zst info.json code-stats.json --clobber
          {
            echo "Rolling nightly database snapshot. Download with \`ldg update\`."
            echo
            echo '```json'
            cat info.json
            echo '```'
          } > notes.md
          gh release edit snapshot --notes-file notes.md

  deploy:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
